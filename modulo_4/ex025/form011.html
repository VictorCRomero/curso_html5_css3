<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body onload="ConfigurarAnoMax()">
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="iano">Em que ano você nasceu? </label>
            <input type="number" name="ano" id="iano" required min="1900" max="" oninput="AtualizarTela()">
        </p>
        <p>
            <label for="iidade">Sua idade é: </label>
            <output id="iidade">0</output>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar" onclick="iidade.innerHTML = 0">
        </p>
    </form>
    <script>
        function ConfigurarAnoMax() {
            let atual = new Date().getFullYear();
            iano.max = atual;
        }
        function CalcIdade() {
            let atual = new Date().getFullYear();
            let anoDigitado = Number(iano.value);
            if (anoDigitado >= 1900 && anoDigitado <= atual ) {
                return atual - anoDigitado;
            }else if (anoDigitado > atual || (anoDigitado < 1900 && iano.value.length > 0)) {
                return "Ano Inválido!";
            } else {
                return 0;
            }
        }
        function AtualizarTela() {
            iidade.innerHTML = CalcIdade ();
        }
    </script>
</body>
</html>
