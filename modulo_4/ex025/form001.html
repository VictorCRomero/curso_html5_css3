<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Meu Primeiro formulário</h1>
        <form action="cadastro.php" autocomplete="off">
            <p>
                <label for="Inome">Nome:</label> 
                <input type="text" name="Nome" id="Inome"></p>
            <p>
                <label for="Isobrenome">Sobrenome:</label> 
                <input type="text" name="Sobrenome" id="Isobrenome"></p>
            <p><input type="submit" value="Enviar"></p>
        </form>
</body>
</html>
<!--
Label é a etiqueta do campo
Action é a tag que vincula qual programa irá processar as informações inseridas
-->
