<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com HTML5</title>
</head>
<body>
    <h1>Inserindo Vídeos hospedados localmente</h1>
    <p>Este vídeo está hospedado no meu próprio servidor</p>
    <!-- <video src="midia/midialimao720m4v.m4v" width="500" controls></video> -->
    <!-- Forma simplificada a cima -->
    <video width="560" height="315" poster="midia/limoes-capa.png" controls loop>
        <!-- A ordem importa, ele tentará um dos abaixos até conseguir.-->
        <source src="midia/midialimao720m4v.m4v" type="video/mp4">
        <source src="midia/midialimao720webm.webm" type="video/webm">
        <source src="midia/midia_limao.mp4" type="video/mp4">
        <source src="midia/midialimaoogv.ogv" type="video/mp4"><!--OGV não pega no safari-->
        <p>Seu navegador não tem compatibilidade com reprodução de vídeos.</p>
    </video>
    <h1>Inserindo vídeos do Youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/FdE5G95B7Mg" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    <h1>Inserido Vídeos do Vimeo</h1>
    <iframe src="https://player.vimeo.com/video/417206810?h=4760559965&color=ff9933" width="560" height="315" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
</body>
</html>
