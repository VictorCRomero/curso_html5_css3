<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual tag deverá utilizar em cada caso.</p>
    <ul type="square"> 
        <li><abbr title="Use a tag &lt;p&gt;">Parágrafo</abbr></li>
        <li><abbr title="Use a tag &lt;h1&gt; até &lt;h6&gt;">Títulos</abbr></li>
        <li><abbr title="Use a tag &lt;img&gt;">Imagens</abbr></li>
        <li><abbr title="Use a tag &lt;abbr&gt;">Abreviações</abbr></li>
        <li><abbr title="Use a tag &lt;code&gt; e se for para manter o indentação englobamos com a tag &lt;pre&gt;">Código-fonte</abbr></li>
        <li><abbr title="Use a tag &lt;ol&gt; e demarque o itens com a tag &lt;li&gt;">Listas númeradas</abbr></li>
        <li><abbr title="Use a tag &lt;dl&gt; para lista, dentro da tag acrescente a tag &lt;dt&gt; para o termo e a tag &lt;dd&gt; para a descrição">Listas com demarcadores</abbr></li>
    </ul>
</body>
</html>
