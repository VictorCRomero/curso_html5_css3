<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1{/* box-level */

            /*
            display: inline;
            
            */

            background-color: lightgray;
            
            height: 300px;
            width: 300px;
            
            border-width: 10px;
            border-style: solid;
            border-color: darkslategray;
            /*
            shorthand
            border: 10px solid darkslategray;
                    width style color
            */
            
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            /*
            shorthand
            padding: 10px 10px 10px 10px;
                     top  right bottom left
            */ 

            margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 10px;
            margin-left: 10px;
            /*margin: auto; deixa a caixa centralizada na página */
            
            outline-width: 5px;
            outline-style: dashed;
            outline-color: salmon;
        }

        a { /* inline- level */
            border-width: 10px;
            border-style: solid;
            border-color: red;
        }

    /*
    block-level

    <noscript>

    <section>

    inline-level

    <span>

    <sub>
    <textarea>
    <tt>
    <var>
    */
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona.</p>
