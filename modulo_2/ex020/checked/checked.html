<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Clique </title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        /* 1. Esconde o quadradinho do checkbox para ninguém ver */
        #meu-trigger {
            display: none;
        }

        /* Estiliza o texto de clique para parecer um botão interativo */
        .botao-clique {
            display: inline-block;
            cursor: pointer;
            color: #125189;
            font-weight: bold;
            text-decoration: underline;
        }

        /* 2. Deixa o parágrafo escondido por padrão */
        .conteudo-escondido {
            display: none;
        }

        /* 3. A MÁGICA: Quando o checkbox for ativado (:checked), 
           procure o parágrafo irmão (~ .conteudo-escondido) e mostre ele */
        #meu-trigger:checked ~
         .conteudo-escondido {
            display: block;
            color: white;
            background-color: red;
            width: 300px;
            padding: 10px;
            margin-top: 10px;
        }

        /* Altera a cor do texto do botão quando ativado */
        #meu-trigger:checked ~ .botao-clique {
            color: red;
        }
        .botao-clique:hover {
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>Exemplo de clique</h1>
    <p>Clique no texto abaixo para exibir ou esconder</p>
    
    <div>
        <!-- O input precisa vir ANTES do texto que vai mudar -->
        <input type="checkbox" id="meu-trigger">
        
        <!-- O label está conectado ao input pelo id "meu-trigger" -->
        <label for="meu-trigger" class="botao-clique">Clique aqui.</label>
        
        <p class="conteudo-escondido">TEXTO ESCONDIDO!</p>
        <p class="conteudo-escondido">TEXTO ESCONDIDO!</p>
    </div>
    
    <p>Fim do exemplo</p>
</body>
</html>
