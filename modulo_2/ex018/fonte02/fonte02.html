<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
            /*
            fontes em textos
            dafont.com
            */
            /*
            whatfontis.com
            https://www.fontsquirrel.com
            myfonts.com

            fontes em imagens
            */
                /*
                Tipos de Format():
                - opentype (otf)
                - truetipe (ttf)
                - embedded-opentype
                - truetype-aat (Apple Advanced Typography)
                - svg
                */
        @font-face {
            font-family: 'Love';
            src: url('fontes/love_larry/love larry ttf.ttf') format('truetype'), url('fontes/love_larry/love larry otf.otf') format('opentype');
            /*dois formatos de fontes*/
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-family: 'Love', Times, serif;
            font-size: 3em;
        }
    </style>
</head>
<body>
    <h1>Olá Mundo!</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Recusandae, quam, adipisci non fugit tempore, animi eum suscipit debitis commodi sint doloribus eveniet ratione. Ea, perspiciatis. Delectus libero cupiditate autem iusto.</p>
</body>
</html>
