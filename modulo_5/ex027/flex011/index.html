<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;
            display:flex;
            flex-flow: row nowrap;
        }
        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 200px;
            flex-shrink: 1;
            flex-grow: 1;
        }
        #i1 {
            flex-shrink: 0;
            flex-grow: 1;
        }
        #i2 {
            flex-shrink: 3;
            flex-grow: 0;
        }
        #i3 {
            flex-shrink: 9;
            flex-grow: 2;
        }
        /*
        o crescimento ou encolhimento é dado pela diferença entre as multiplicações entre eles do menor número para o maior número sendo uma função exponencial decrescente
        */
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
    </div>
</body>
</html>
