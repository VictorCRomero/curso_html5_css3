<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;
            display: flex;
            /*flex-direction: row-reverse;
            flex-wrap: wrap-reverse;*/
            flex-flow: row wrap;
        }
        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            flex: auto;
        }
        /*
        flex-flow:; = flex-direction:; + flex-wrap:; 
        usasse mais flex-flow:; recomendação da W3C

        flex-wrap:no-wrap -> sem quebra

        flex-direction: row;
        flex-wrap: wrap;
        quebra para baixo e vai seguindo para direita

        flex-direction: row;
        flex-wrap: wrap-reverse;
        quebra para cima e vai seguindo para direita

        flex-direction: row-reverse;
        flex-wrap: wrap;
        quebra para baixo e vai seguindo para esquerda
        
        flex-direction: row-reverse;
        flex-wrap: wrap-reverse;
        quebra para cima e vai seguindo para esquerda
        
        flex-direction: column;
        flex-wrap: wrap;
        quebra para a direita e vai seguindo para baixo

        flex-direction: column;
        flex-wrap: wrap-reverse;
        quebra para esqueda e vai seguindo para baixo

        flex-direction: column-reverse;
        flex-wrap: wrap;
        quebra para a direita e vai seguindo para cima

        flex-direction: column-reverse;
        flex-wrap: wrap-reverse;
        quebra para esqueda e vai seguindo para cima
        */
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">Exemplo de bloco A</div>
        <div class="item">Exemplo de bloco B</div>
        <div class="item">Exemplo de bloco C</div>
        <div class="item">Exemplo de bloco D</div>
        <div class="item">Exemplo de bloco E</div>
        <div class="item">Exemplo de bloco F</div>
        <div class="item">Exemplo de bloco G</div>
    </div>
</body>
</html>
